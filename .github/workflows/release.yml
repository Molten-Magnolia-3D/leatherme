name: Publish app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
          - os: macos-latest
            args: --mac dmg
          - os: ubuntu-latest
            args: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install, build, and package
        run: |
          npm ci
          npm run build
          node scripts/prepare-standalone.mjs
          npx electron-builder ${{ matrix.args }} --publish never
      - name: Upload app to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist-app/*.{exe,dmg,AppImage,zip,yml,blockmap})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packaged app files found"
            ls -la dist-app || true
            exit 1
          fi
          gh release upload "${{ needs.release.outputs.tag }}" "${files[@]}" --clobber
